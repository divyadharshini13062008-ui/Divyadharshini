{% extends "base.html" %}

{% block content %}

<section class="planner-wrap">

    <div class="container">

        <div class="form-card">

            <span class="eyebrow">
                PLANNER 02
            </span>

            <h1>
                Party Planner
            </h1>

            <div
                id="message"
                class="message"
                hidden
            ></div>

            <form data-planner="party">

                <div class="form-grid">

                    <div class="field">

                        <label>
                            Occasion
                        </label>

                        <input
                            name="occasion"
                            placeholder="Birthday, wedding, reunion..."
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            Budget (₹)
                        </label>

                        <input
                            name="budget"
                            type="number"
                            min="1"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            Guests
                        </label>

                        <input
                            name="guests"
                            type="number"
                            min="1"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            Location type
                        </label>

                        <select
                            name="location_type"
                            required
                        >
                            <option>
                                Home
                            </option>

                            <option>
                                Hall
                            </option>

                            <option>
                                Outdoor
                            </option>

                            <option>
                                Restaurant
                            </option>
                        </select>

                    </div>


                    <div class="field">

                        <label>
                            Theme
                        </label>

                        <input
                            name="theme"
                            placeholder="e.g. pastel, elegant, sports"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            Food preference
                        </label>

                        <input
                            name="food_preference"
                            placeholder="Vegetarian, mixed, snacks..."
                        >

                    </div>


                    <div class="field full">

                        <label>
                            Additional requirements
                        </label>

                        <textarea
                            name="additional_requirements"
                        ></textarea>

                    </div>

                </div>


                <div class="form-actions">

                    <button
                        class="button"
                        type="submit"
                    >
                        Generate plan
                    </button>

                </div>

            </form>

        </div>


        <div
            id="results"
            class="result-card results"
        >

            <p class="muted">
                Your recommendation will appear here.
            </p>

        </div>

    </div>

</section>

{% endblock %}
