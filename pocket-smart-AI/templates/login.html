{% extends "base.html" %}

{% block content %}

<section class="auth">

    <div class="form-card">

        <span class="eyebrow">
            WELCOME BACK
        </span>

        <h1>
            Log in
        </h1>

        <div
            id="message"
            class="message"
            hidden
        ></div>

        <form id="login-form">

            <div class="field">

                <label>
                    Username
                </label>

                <input
                    name="username"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Password
                </label>

                <input
                    name="password"
                    type="password"
                    required
                >

            </div>


            <div class="form-actions">

                <button
                    class="button"
                    type="submit"
                >
                    Log in
                </button>

            </div>

        </form>


        <p class="muted">

            No account?

            <a href="/register">
                Create one
            </a>.

        </p>

    </div>

</section>

{% endblock %}
